# ===================================================================
# Coolify Cloud-Native Deployment for Economy Aggregator
# Persistent Parquet Lakehouse + Subscriptions + Anti-Censorship DNS
# ===================================================================

services:
  economy-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    # Anti-censorship DNS for crypto, TradingView, and prediction market venues
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - WEB_DIST_DIR=/app/web/dist
      - RUST_LOG=${RUST_LOG:-info}
      - AGGREGATOR_API_KEY=${AGGREGATOR_API_KEY:-}
      - AGGREGATOR_API_KEYS=${AGGREGATOR_API_KEYS:-}
      - AGGREGATOR_ADMIN_USER=${AGGREGATOR_ADMIN_USER:-admin}
      - AGGREGATOR_ADMIN_PASSWORD_HASH=${AGGREGATOR_ADMIN_PASSWORD_HASH:-}
      - AGGREGATOR_SESSION_SECRET=${AGGREGATOR_SESSION_SECRET:-}
    volumes:
      - economy_lake_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  economy_lake_data:
    driver: local
